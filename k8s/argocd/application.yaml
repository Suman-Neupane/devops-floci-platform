apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudops-floci-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/Suman-Neupane/devops-floci-platform.git'
    targetRevision: HEAD
    path: k8s/helm/cloud-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
