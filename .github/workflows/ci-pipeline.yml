name: CI/CD Pipeline (Build, Test, Scan)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-scan:
    name: Test Application & Scan Security
    runs-on: ubuntu-latest

    services:
      floci:
        image: floci/floci:latest
        ports:
          - 4566:4566

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run PyTest Integration Suite against Floci
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_DEFAULT_REGION: eu-central-1
        run: |
          cd app
          pytest -v tests/

      - name: Run Trivy Vulnerability Scanner on Container
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'cloud-app:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Build Docker Image
        run: |
          docker build -t cloud-app:latest ./app
